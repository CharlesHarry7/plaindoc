<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlainDoc — 合同账单一键读懂</title>
  <meta name="description" content="粘贴租房合同或账单，一键得到白话解读与行动清单。$9 起。" />
  <style>
    :root { --bg:#0b1020; --card:#141a2e; --accent:#6c8cff; --text:#eef1ff; --muted:#9aa3c7; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background:radial-gradient(1200px 600px at 20% -10%,#1a2550,var(--bg)); color:var(--text); }
    .wrap { max-width:880px; margin:0 auto; padding:48px 20px 80px; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height:1.15; margin:0 0 12px; }
    p.lead { color:var(--muted); font-size:1.1rem; margin:0 0 28px; }
    .cta { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:40px; }
    a.btn, button.btn { appearance:none; border:0; border-radius:12px; padding:12px 18px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-ghost { background:#222a45; color:var(--text); }
    .cards { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid #243056; border-radius:16px; padding:18px; }
    .card h3 { margin:0 0 8px; font-size:1.05rem; }
    .card p { margin:0; color:var(--muted); font-size:.95rem; }
    .price { font-size:1.4rem; font-weight:700; margin-top:10px; }
    footer { margin-top:48px; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>看不懂的合同 / 账单<br/>一键变成白话 + 行动清单</h1>
    <p class="lead">粘贴租房合同、医疗账单或 offer 条款。PlainDoc 用 AI 标出坑点、费用与下一步该做什么。按次付费，不用订阅。</p>
    <div class="cta">
      <a class="btn btn-primary" href="/decode.html">先试用解读</a>
      <button class="btn btn-ghost" id="buy9" type="button">买 1 次 · $9</button>
      <button class="btn btn-ghost" id="buy29" type="button">买 5 次 · $29</button>
    </div>
    <div class="cards">
      <div class="card"><h3>租房合同</h3><p>押金、违约、涨租、维修责任一眼看清。</p></div>
      <div class="card"><h3>账单拆解</h3><p>哪些能争、哪些该付，列成清单。</p></div>
      <div class="card"><h3>按次收费</h3><p class="price">$9 / $29</p><p>复用现成 Stripe Checkout，毛利高、上线快。</p></div>
    </div>
    <footer>PlainDoc MVP skeleton · separate from DreamUtopia · Stripe keys via env</footer>
  </div>
  <script>
    async function checkout(pack) {
      const r = await fetch('/api/stripe/checkout', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pack })
      });
      const data = await r.json();
      if (data.url) location.href = data.url;
      else alert(data.error || 'Checkout not configured yet');
    }
    document.getElementById('buy9').onclick = () => checkout('single');
    document.getElementById('buy29').onclick = () => checkout('pack5');
  </script>
</body>
</html>
