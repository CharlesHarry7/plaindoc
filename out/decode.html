<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>解读 — PlainDoc</title>
  <style>
    :root { --bg:#0b1020; --card:#141a2e; --accent:#6c8cff; --text:#eef1ff; --muted:#9aa3c7; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:880px; margin:0 auto; padding:32px 20px 80px; }
    a { color:var(--accent); }
    textarea { width:100%; min-height:220px; border-radius:14px; border:1px solid #243056; background:var(--card); color:var(--text); padding:14px; font-size:1rem; }
    select, button { margin-top:12px; border-radius:12px; border:0; padding:12px 16px; font-weight:600; }
    select { background:#222a45; color:var(--text); margin-right:8px; }
    button { background:var(--accent); color:#fff; cursor:pointer; }
    #out { margin-top:20px; background:var(--card); border:1px solid #243056; border-radius:16px; padding:18px; white-space:pre-wrap; color:var(--muted); min-height:120px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="/">← PlainDoc</a></p>
    <h1>粘贴文档，一键解读</h1>
    <select id="kind">
      <option value="lease">租房合同</option>
      <option value="bill">账单</option>
      <option value="offer">Offer / 劳动合同</option>
      <option value="other">其他</option>
    </select>
    <textarea id="doc" placeholder="在此粘贴合同或账单全文（建议去掉身份证号等敏感信息）"></textarea>
    <div><button id="go" type="button">开始解读</button></div>
    <div id="out">结果会出现在这里。未接 LLM key 时返回结构化 demo。</div>
  </div>
  <script>
    document.getElementById('go').onclick = async () => {
      const out = document.getElementById('out');
      out.textContent = '解读中…';
      const r = await fetch('/api/decode', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          kind: document.getElementById('kind').value,
          text: document.getElementById('doc').value
        })
      });
      const data = await r.json();
      out.textContent = data.markdown || data.error || JSON.stringify(data, null, 2);
    };
  </script>
</body>
</html>
